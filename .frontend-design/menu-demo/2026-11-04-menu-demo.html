<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>食途界面评审</title>
<style>
:root{--accent:#b64b35;--radius:20px;--space:14px;--font:14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#d8d1c6;color:#1d2b28}.app{height:100vh;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid #d9d0c1}.bar h1{font-size:15px;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid #d9d0c1;border-radius:9px;background:#fff;padding:7px 11px;cursor:pointer}.btn.on,.btn.primary{background:#1d2b28;color:#fff;border-color:#1d2b28}.layout{display:grid;grid-template-columns:280px 1fr;min-height:0}.controls{background:#fff;padding:16px;border-right:1px solid #d9d0c1;overflow:auto}.controls h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#777}.control{margin:16px 0}.control label{display:block;font-size:12px;margin-bottom:7px}.control input{width:100%}.swatches{display:flex;gap:8px}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swatch.active{border-color:#1d2b28}.help{font-size:11px;line-height:1.5;color:#6f746e;background:#f6f1e7;padding:10px;border-radius:10px}.preview-area{overflow:auto;padding:24px;background:#cfc7ba}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-width:760px}.pane{display:grid;justify-items:center;color:var(--text);font-size:var(--font)}.pane.light{--paper:#f6f1e7;--surface:#fffdf8;--line:#d9d0c1;--text:#1d2b28;--muted:#6f746e}.pane.dark{--paper:#16211f;--surface:#22302c;--line:#40504b;--text:#f4eee4;--muted:#aeb8b2}.pane-label{font-size:11px;color:#5b605b;margin-bottom:8px}.phone{width:360px;min-height:720px;background:var(--paper);color:var(--text);border-radius:30px;overflow:hidden;box-shadow:0 20px 50px #4a40362b;border:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line)}.brand{font:700 20px Georgia,"Songti SC",serif}.content{padding:20px 16px 100px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:800}.title{font:700 29px/1.15 Georgia,"Songti SC",serif;margin:7px 0}.summary{color:var(--muted);font-size:12px}.match{margin:16px 0;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));font-size:12px}.card{padding:var(--space);border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);margin:10px 0}.card.hit{box-shadow:inset 3px 0 var(--accent)}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent);font-size:9px;font-weight:800}.dish-head{display:flex;justify-content:space-between;margin-top:8px}.dish-head strong{font-size:16px}.original{font:italic 11px Georgia,serif;color:var(--muted);margin:4px 0 10px}.desc{font-size:12px;line-height:1.5}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:11px}.add{border:1px solid var(--text);border-radius:99px;background:transparent;color:var(--text);padding:6px 10px}.dock{position:relative;margin:-82px 12px 12px;padding:10px;background:color-mix(in srgb,var(--paper) 92%,transparent);border:1px solid var(--line);border-radius:17px;display:flex;gap:8px}.ask{flex:1;border:0;border-radius:11px;background:var(--surface);color:var(--muted);padding:11px}.cart{border:0;border-radius:11px;background:var(--text);color:var(--paper);padding:0 14px;font-weight:700}[data-fd-editable]:hover{outline:1px dashed var(--accent);outline-offset:2px}.comment-mode .pane [data-fd-id]:hover{outline:2px dashed #2563eb;outline-offset:2px;cursor:crosshair}.notes{position:fixed;right:18px;top:70px;width:300px;background:#fff;padding:14px;border-radius:14px;box-shadow:0 14px 40px #0002;display:none}.notes.open{display:block}.notes textarea{width:100%;min-height:80px}.marker{position:fixed;background:#f59e0b;color:white;border-radius:99px;padding:2px 6px;font-size:10px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2b28;color:#fff;padding:9px 13px;border-radius:99px;display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.controls{display:none}.preview-area{padding:12px}}
</style>
</head>
<body><div class="app"><header class="bar"><div><h1>食途 · 真实菜单 Demo 界面评审</h1><small>对应 public/index.html、public/styles.css、public/app.js</small></div><div class="actions"><button class="btn" id="comment">Comment Mode</button><button class="btn" id="reset">Reset</button><button class="btn primary" id="export">Export to markdown</button></div></header><div class="layout"><aside class="controls"><div class="help">这是设计评审面，不是对外产品 Demo。调整参数、直接改文字，或开启 Comment Mode 点击元素添加意见。</div><h2>真实项目变量</h2><div class="control"><label>--accent</label><div class="swatches"><button class="swatch active" data-color="#b64b35" style="background:#b64b35"></button><button class="swatch" data-color="#8c4f3d" style="background:#8c4f3d"></button><button class="swatch" data-color="#a56a1f" style="background:#a56a1f"></button></div></div><div class="control"><label>--radius: <span id="radius-v">20px</span></label><input id="radius" type="range" min="10" max="28" value="20"></div><div class="control"><label>--space: <span id="space-v">14px</span></label><input id="space" type="range" min="10" max="20" value="14"></div><div class="control"><label>--font: <span id="font-v">14px</span></label><input id="font" type="range" min="12" max="17" value="14"></div></aside><main class="preview-area"><div class="pair" id="pair"></div></main></div></div><aside class="notes" id="notes"><strong id="target">Comment</strong><textarea id="note" placeholder="这里应该怎么改？"></textarea><div class="actions" style="margin-top:8px"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Save</button></div></aside><div class="toast" id="toast"></div>
<script>
const PREVIEW_META={source:'.frontend-design/menu-demo/2026-11-04-menu-demo.html',topic:'menu-demo',targetFile:'public/styles.css'};const initial={accent:'#b64b35',radius:20,space:14,font:14};let decisions={...initial},comments=[],commentMode=false,target=null;function phone(theme){return `<section class="pane ${theme}"><div class="pane-label">${theme==='light'?'Light':'Dark'} theme</div><div class="phone" data-fd-id="phone-shell"><header class="top" data-fd-id="app-header"><span class="brand" data-fd-id="brand-title" data-fd-editable>食途</span><small>实时模型</small></header><div class="content"><div class="eyebrow" data-fd-id="step-label">02 · 现场菜单</div><h1 class="title" data-fd-id="restaurant-title" data-fd-editable>Le Petit Bouillon</h1><div class="summary" data-fd-id="session-copy" data-fd-editable>逐页加入菜单，之前的选择会一直保留。</div><div class="match" data-fd-id="guide-summary"><strong>攻略线索：已找到 2/3</strong><br><span>标记仅供参考，由你决定是否加入</span></div><article class="card hit" data-fd-id="dish-guide-hit"><span class="badge">攻略推荐 · 未自动选择</span><div class="dish-head"><strong data-fd-id="dish-title" data-fd-editable>油封鸭腿配萨拉代兹土豆</strong><b>26 €</b></div><div class="original">Confit de canard, pommes sarladaises</div><div class="desc">盐渍慢煮鸭腿配蒜香土豆，外脆内嫩、咸香浓郁</div><div class="card-foot"><span>查看菜单原文 ↗</span><button class="add">+ 加入</button></div></article><article class="card" data-fd-id="dish-regular"><div class="dish-head"><strong>勃艮第红酒炖牛肉</strong><b>28 €</b></div><div class="original">Bœuf bourguignon, purée maison</div><div class="desc">牛肉以红酒慢炖配土豆泥，软烂醇厚</div><div class="card-foot"><span>查看菜单原文 ↗</span><button class="add">+ 加入</button></div></article></div><footer class="dock" data-fd-id="bottom-actions"><button class="ask">✦ 问口味、比较菜品…</button><button class="cart">已选 1</button></footer></div></section>`}document.querySelector('#pair').innerHTML=phone('light')+phone('dark');function apply(){document.documentElement.style.setProperty('--accent',decisions.accent);document.documentElement.style.setProperty('--radius',decisions.radius+'px');document.documentElement.style.setProperty('--space',decisions.space+'px');document.documentElement.style.setProperty('--font',decisions.font+'px');['radius','space','font'].forEach(k=>document.querySelector('#'+k+'-v').textContent=decisions[k]+'px')}document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{decisions.accent=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');apply()});['radius','space','font'].forEach(k=>document.querySelector('#'+k).oninput=e=>{decisions[k]=+e.target.value;apply()});document.querySelectorAll('[data-fd-editable]').forEach(el=>{el.contentEditable='plaintext-only';el.oninput=()=>{const id=el.dataset.fdId;document.querySelectorAll(`[data-fd-id="${id}"][data-fd-editable]`).forEach(x=>{if(x!==el)x.textContent=el.textContent})}});document.querySelector('#comment').onclick=()=>{commentMode=!commentMode;document.body.classList.toggle('comment-mode',commentMode);document.querySelector('#comment').classList.toggle('on',commentMode)};document.querySelector('.pair').onclick=e=>{if(!commentMode)return;const el=e.target.closest('[data-fd-id]');if(!el)return;target=el.dataset.fdId;document.querySelector('#target').textContent=target;document.querySelector('#notes').classList.add('open')};document.querySelector('#cancel').onclick=()=>document.querySelector('#notes').classList.remove('open');document.querySelector('#save').onclick=()=>{const text=document.querySelector('#note').value.trim();if(text)comments.push({target,text});document.querySelector('#note').value='';document.querySelector('#notes').classList.remove('open');show('Comment saved')};document.querySelector('#reset').onclick=()=>{decisions={...initial};comments=[];location.reload()};function build(){const lines=['## Frontend design round-trip','Source: '+PREVIEW_META.source,'Captured at: '+new Date().toISOString().slice(0,19).replace('T',' ')+' (local)','Skill: frontend-design','Topic: '+PREVIEW_META.topic,''];const changed=Object.keys(initial).filter(k=>decisions[k]!==initial[k]);if(changed.length){lines.push('### Decisions','');changed.forEach(k=>lines.push('- `--'+k+'` → `'+decisions[k]+(k==='accent'?'':'px')+'`'));lines.push('')}const edits=[];document.querySelectorAll('.light [data-fd-editable]').forEach(el=>edits.push({id:el.dataset.fdId,value:el.textContent.trim()}));if(edits.length){lines.push('### Direct edits','');edits.forEach((e,i)=>lines.push('#### Edit '+(i+1),'\- Element: `[data-fd-id="'+e.id+'"]` ('+e.id+')','\- Kind: text','\- Value: '+e.value,''))}if(comments.length){lines.push('### Element comments','');comments.forEach((c,i)=>lines.push('#### Comment '+(i+1),'\- Element: `[data-fd-id="'+c.target+'"]` ('+c.target+')','\- Scope: this','\- Note: '+c.text,''))}lines.push('### Apply','','When applying these changes:','','1. Apply token decisions and direct edits to `public/styles.css` and `public/app.js`.','2. Honor element comments by locating the matching `data-fd-id`.','3. Verify the real route with `python3 server.py`.');return lines.join('\n')}document.querySelector('#export').onclick=async()=>{const text=build();await navigator.clipboard.writeText(text).catch(()=>{});show('Export copied to clipboard')};function show(t){const el=document.querySelector('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',1800)}apply();
</script></body></html>
