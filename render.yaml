# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: dinetrail-demo
    runtime: docker
    region: frankfurt
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: MODEL_API_TYPE
        value: openai_compatible
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: MODEL_RESPONSE_FORMAT
        value: json_schema
      - key: MODEL_STREAM
        value: "true"
      - key: OCR_PROVIDER
        value: none
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_DATA_DIR
        value: /data
      - key: SESSION_TTL_SECONDS
        value: "172800"
      - key: MODEL_REQUESTS_PER_WINDOW
        value: "10"
      - key: MODEL_REQUESTS_PER_SESSION_WINDOW
        value: "20"
      - key: MODEL_REQUESTS_GLOBAL_PER_WINDOW
        value: "100"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "86400"
      - key: SESSION_WRITES_PER_WINDOW
        value: "600"
      - key: SESSION_MAX_ACTIVE
        value: "500"
      - key: SESSION_MAX_STORED_IMAGE_BYTES
        value: "104857600"
